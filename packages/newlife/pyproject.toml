[project]
name = "newlife"
version = "0.1.0"
description = "A verifiable profile layer for composable biological simulation: path authority, effect validation, single-path lowering, canonical evidence traces."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["proofroot"]

[project.optional-dependencies]
process-bigraph = ["process-bigraph==1.8.3"]
# 第十六个里程碑：一个真正独立的第三方包。走 optional extra，不进主依赖面
spatio-flux = ["spatio-flux==1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
proofroot = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/newlife"]

[dependency-groups]
dev = ["pytest>=8"]
