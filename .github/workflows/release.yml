name: build-and-publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Configure test Git identity
        run: |
          git config --global user.name "newlife release CI"
          git config --global user.email "release-ci@example.invalid"
      - name: Require tag to match both package versions
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME"
      - name: Test proofroot
        run: |
          uv sync --package proofroot
          uv run --package proofroot pytest packages/proofroot/tests -q
      - name: Test newlife
        run: |
          uv sync --package newlife --extra process-bigraph
          uv run --package newlife pytest packages/newlife/tests -q
      - name: Check architecture imports
        run: python scripts/check_imports.py
      # 冒烟安装从 PyPI 解析 exloop：newlife 依赖的 exloop 版本必须已经在 PyPI 上（docs/releasing.md）。
      - name: Build and inspect both distributions
        run: |
          uv build --all-packages --out-dir dist
          uvx --from twine twine check dist/*
          uvx check-wheel-contents dist/*.whl
          python scripts/check_release_artifacts.py dist
          python scripts/smoke_release_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  # 两个 job，各自的 environment。**PyPI 不允许同一套 owner/repo/workflow/environment
  # 为两个不同项目各注册一个 pending publisher**（会报 "already been registered for a
  # different project name"），所以 environment 名必须分开。
  #
  # 顺带解决另一件事：一次上传两个包时，前一个成功、后一个失败会卡住重试——
  # 拆成两个 job 之后，GitHub 的「只重跑失败的 job」就够用，
  # **不必给成功的那个加 skip-existing 去掩盖重复上传。**
  publish-proofroot:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-proofroot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Isolate proofroot artifacts
        run: mkdir -p upload && mv dist/proofroot-* upload/
      - name: Publish proofroot with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  # newlife 依赖 proofroot<0.2,>=0.1，所以 proofroot 必须先上去——
  # 否则 `pip install newlife` 会死在找不到依赖。**needs 把这个顺序钉死。**
  publish-newlife:
    needs: publish-proofroot
    runs-on: ubuntu-latest
    environment: pypi-newlife
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Isolate newlife artifacts
        run: mkdir -p upload && mv dist/newlife-* upload/
      - name: Publish newlife with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
