name: lint-and-test

# 2026-09-06 起 push / PR 自动触发（公开仓库的 Actions 分钟免费；此前私有时只手动跑）。
# 本地等价命令见 CONTRIBUTING.md；手动触发仍保留：
#   gh workflow run lint-and-test          # 或 Actions 页面的 "Run workflow" 按钮
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  import-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_imports.py
      - name: ruff (F811 shadowed definitions)
        uses: astral-sh/ruff-action@v3
        with:
          args: check --select F811 packages scripts

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --package proofroot
      - run: uv run --package proofroot pytest packages/proofroot/tests -q
      # --extra process-bigraph 不是可选的：五个测试模块无条件 import bigraph_schema，
      # 缺它 pytest 在 collection 阶段就失败（ModuleNotFoundError: bigraph_schema）。
      - run: uv sync --package newlife --extra process-bigraph
      - run: uv run --package newlife pytest packages/newlife/tests -q
        if: hashFiles('packages/newlife/tests/**') != ''
